name: Test bazelisk-version download
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          bazelisk-version: "1.x"
          cache-save: "false"
      - name: Assert bazel (bazelisk) is on PATH from tool cache
        run: |
          BAZEL_PATH="$(command -v bazel || true)"
          echo "bazel path: $BAZEL_PATH"
          if [ -z "$BAZEL_PATH" ]; then
            echo "FAIL: bazel not found on PATH"
            exit 1
          fi
          case "$BAZEL_PATH" in
            *bazelisk*) ;;
            *) echo "FAIL: expected bazel from bazelisk tool cache"; exit 1 ;;
          esac
          if [ ! -x "$BAZEL_PATH" ]; then
            echo "FAIL: bazel is not executable"
            exit 1
          fi
          echo "PASS"
