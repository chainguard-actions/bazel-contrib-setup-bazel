name: Test google-credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          google-credentials: '{"type":"service_account","project_id":"test-project"}'
          cache-save: "false"
      - name: Assert credentials written and referenced
        run: |
          echo "--- $HOME/.bazelrc ---"
          cat "$HOME/.bazelrc"
          echo "---"
          LINE="$(grep -- '^build --google_credentials=' "$HOME/.bazelrc" || true)"
          echo "line: $LINE"
          if [ -z "$LINE" ]; then
            echo "FAIL: google_credentials flag missing"
            exit 1
          fi
          KEY="${LINE#build --google_credentials=}"
          echo "key path: $KEY"
          case "$KEY" in
            */key.json) ;;
            *) echo "FAIL: unexpected key path"; exit 1 ;;
          esac
          if [ ! -f "$KEY" ]; then
            echo "FAIL: key file does not exist"
            exit 1
          fi
          CONTENT="$(cat "$KEY")"
          echo "content: $CONTENT"
          if [ "$CONTENT" != '{"type":"service_account","project_id":"test-project"}' ]; then
            echo "FAIL: key content mismatch"
            exit 1
          fi
          echo "PASS"
