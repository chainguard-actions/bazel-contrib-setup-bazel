name: Test disk and repository cache flags
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          disk-cache: "true"
          repository-cache: "true"
          cache-save: "false"
          cache-restore-timeout: "60000"
      - name: Assert cache flags in ~/.bazelrc
        run: |
          echo "--- $HOME/.bazelrc ---"
          cat "$HOME/.bazelrc"
          echo "---"
          for line in "build --disk_cache=$HOME/.cache/bazel-disk" "common --repository_cache=$HOME/.cache/bazel-repo" "startup --output_base=$HOME/.bazel"; do
            if ! grep -qxF "$line" "$HOME/.bazelrc"; then
              echo "FAIL: missing line '$line'"
              exit 1
            fi
          done
          echo "PASS"
